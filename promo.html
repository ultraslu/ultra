
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Promotions | Ultra Flames</title>
    <link rel="icon" href="logo.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #121212, #1e1e1e);
            color: #f0f0f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #333;
        }

        header img {
            height: 40px;
            cursor: pointer;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            margin: 0 0.5rem;
            color: #f0f0f0;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s, transform 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: #ff7043;
        }

        /* INTRODUCTION */

        .intro {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }

        .intro h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #ff7043;
            margin: 0;
        }

        .intro p {
            color: #aaa;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 0.3rem;
        }

        /* WEEKLY CALENDAR */

        .calendar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 1rem;
        }

        .day-tab {
            background: #242424;
            color: #ddd;
            border: 1px solid #383838;
            border-radius: 6px;
            padding: 10px 18px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .day-tab:hover,
        .day-tab.active {
            background: #ff7043;
            border-color: #ff7043;
            color: #121212;
        }

        /* SLIDESHOW */

        .slideshow {
            max-width: 650px;
            width: 100%;
            margin: auto;
            padding: 0 18px 45px;
        }

        .slide {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FLYER */

        .flyer-container {
            position: relative;
            background: #1e1e1e;
            border: 1px solid #383838;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.45);
        }

        .flyer-container img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            min-height: 250px;
        }

        .day-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,112,67,0.95);
            color: #121212;
            padding: 7px 15px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 2;
        }

        /* NAVIGATION CONTROLS */

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
        }

        .arrow {
            background: #242424;
            color: #ff7043;
            border: 1px solid #444;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .arrow:hover {
            background: #ff7043;
            color: #121212;
        }

        .counter {
            color: #bbb;
            font-size: 0.9rem;
        }

        /* SLIDESHOW DOTS */

        .dots {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-top: 18px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
            border: none;
            padding: 0;
            transition: 0.3s;
        }

        .dot.active {
            background: #ff7043;
            transform: scale(1.3);
        }

        .auto-label {
            text-align: center;
            color: #777;
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-top: 22px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px 15px;
            border-top: 1px solid #333;
            color: #777;
            font-size: 0.8rem;
        }

        /* MOBILE RESPONSIVENESS */

        @media (max-width: 600px) {

            header {
                padding: 10px 15px;
            }

            header img {
                height: 38px;
            }

            nav {
                gap: 5px;
            }

            nav a {
                font-size: 0.75rem;
                margin: 0 0.3rem;
            }

            .intro h1 {
                font-size: 2.7rem;
            }

            .day-tab {
                padding: 9px 12px;
                font-size: 0.75rem;
            }

            .slideshow {
                padding-left: 12px;
                padding-right: 12px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <a href="index.html">
            <img src="logo.png" alt="Ultra Flames Logo">
        </a>

        <nav>
            <a href="index.html">Drinks</a>
            <a href="promo.html" class="active">Promotions</a>
        </nav>
    </header>

    <!-- PAGE INTRODUCTION -->

    <main>

        <div class="intro">
            <h1>Weekly Promotions</h1>
            <p>YOUR WEEK AT ULTRA FLAMES</p>
        </div>

        <!-- WEEKLY CALENDAR -->

        <div class="calendar">

            <button class="day-tab active" onclick="showSlide(0)">
                WED
            </button>

            <button class="day-tab" onclick="showSlide(1)">
                THU
            </button>

            <button class="day-tab" onclick="showSlide(2)">
                FRI
            </button>

            <button class="day-tab" onclick="showSlide(3)">
                SAT
            </button>

            <button class="day-tab" onclick="showSlide(4)">
                SUN
            </button>

        </div>

        <!-- PROMOTIONAL FLYERS -->

        <div class="slideshow">

            <!-- WEDNESDAY -->

            <div class="slide active">
                <div class="flyer-container">

                    <span class="day-label">WEDNESDAY</span>

                    <img
                        src="imgs/Wednesday.jpeg"
                        alt="Wednesday Promotions"
                    >

                </div>
            </div>

            <!-- THURSDAY -->

            <div class="slide">
                <div class="flyer-container">

                    <span class="day-label">THURSDAY</span>

                    <img
                        src="imgs/Thursday.jpeg"
                        alt="Thursday Promotions"
                    >

                </div>
            </div>

            <!-- FRIDAY -->

            <div class="slide">
                <div class="flyer-container">

                    <span class="day-label">FRIDAY</span>

                    <img
                        src="imgs/Friday.jpeg"
                        alt="Friday Promotions"
                    >

                </div>
            </div>

            <!-- SATURDAY -->

            <div class="slide">
                <div class="flyer-container">

                    <span class="day-label">SATURDAY</span>

                    <img
                        src="imgs/Saturday.jpeg"
                        alt="Saturday Promotions"
                    >

                </div>
            </div>

            <!-- SUNDAY -->

            <div class="slide">
                <div class="flyer-container">

                    <span class="day-label">SUNDAY</span>

                    <img
                        src="imgs/Sunday.jpeg"
                        alt="Sunday Promotions"
                    >

                </div>
            </div>

            <!-- SLIDESHOW CONTROLS -->

            <div class="controls">

                <button
                    class="arrow"
                    onclick="changeSlide(-1)"
                    aria-label="Previous day"
                >
                    &#8249;
                </button>

                <span class="counter" id="counter">
                    01 / 05
                </span>

                <button
                    class="arrow"
                    onclick="changeSlide(1)"
                    aria-label="Next day"
                >
                    &#8250;
                </button>

            </div>

            <!-- SLIDESHOW INDICATORS -->

            <div class="dots">

                <button class="dot active" onclick="showSlide(0)" aria-label="Wednesday"></button>

                <button class="dot" onclick="showSlide(1)" aria-label="Thursday"></button>

                <button class="dot" onclick="showSlide(2)" aria-label="Friday"></button>

                <button class="dot" onclick="showSlide(3)" aria-label="Saturday"></button>

                <button class="dot" onclick="showSlide(4)" aria-label="Sunday"></button>

            </div>

            <div class="auto-label">
                AUTOMATIC SLIDESHOW · EVERY 6 SECONDS
            </div>

        </div>

    </main>

    <!-- FOOTER -->

    <footer>

        <p>© Ultra Flames. All Rights Reserved.</p>

        <p>Website designed and maintained by cazvfa</p>

    </footer>

    <!-- JAVASCRIPT -->

    <script>

        let currentSlide = 0;

        const slides = document.querySelectorAll('.slide');
        const tabs = document.querySelectorAll('.day-tab');
        const dots = document.querySelectorAll('.dot');
        const counter = document.getElementById('counter');

        let slideshowTimer;

        function showSlide(index) {

            currentSlide =
                (index + slides.length) % slides.length;

            slides.forEach((slide, i) => {
                slide.classList.toggle(
                    'active',
                    i === currentSlide
                );
            });

            tabs.forEach((tab, i) => {
                tab.classList.toggle(
                    'active',
                    i === currentSlide
                );
            });

            dots.forEach((dot, i) => {
                dot.classList.toggle(
                    'active',
                    i === currentSlide
                );
            });

            counter.textContent =
                String(currentSlide + 1).padStart(2, '0') +
                ' / ' +
                String(slides.length).padStart(2, '0');

            resetTimer();
        }

        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }

        function resetTimer() {

            clearInterval(slideshowTimer);

            slideshowTimer = setInterval(() => {
                showSlide(currentSlide + 1);
            }, 6000);

        }

        // Start automatic slideshow

        resetTimer();

        // Pause slideshow when browser tab is hidden

        document.addEventListener(
            'visibilitychange',
            () => {

                if (document.hidden) {

                    clearInterval(slideshowTimer);

                } else {

                    resetTimer();

                }

            }
        );

    </script>

</body>
</html>
